spring.application.name=collab-backend
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/collabdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Database migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# API documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT settings
app.jwt.secret=${JWT_SECRET:replace-this-with-a-long-local-dev-secret-key-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Application metadata
info.app.name=collab-backend
info.app.description=Authenticated real-time collaborative document backend
info.app.java-version=17

# Actuator and observability
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application=${spring.application.name}

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
